image: docker:latest

services:
  - docker:dind

stages:
  - test
  - package
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DOCKER_IMAGE_TAG: "$CI_REGISTRY_IMAGE:latest"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

unit_tests:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  script:
    - chmod +x ./gradlew
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml

docker_build:
  stage: package
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE_TAG .
    - docker push $DOCKER_IMAGE_TAG
    - 'echo "Image uploaded successfully: $DOCKER_IMAGE_TAG"'
  only:
    - main
    - master

deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Initializing ec2 deploy..."
    - ssh $EC2_USER@$EC2_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh $EC2_USER@$EC2_IP "docker pull $DOCKER_IMAGE_TAG"
    - ssh $EC2_USER@$EC2_IP "docker stop directorios-api || true"
    - ssh $EC2_USER@$EC2_IP "docker rm directorios-api || true"
    - ssh $EC2_USER@$EC2_IP "docker run -d -p 8080:8080 --name directorios-api $DOCKER_IMAGE_TAG"
  only:
    - main
    - master